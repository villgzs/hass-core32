name: Build 32-bit Home Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - main
      
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: villgzs/hass-core32

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha.outputs.version }}
    steps:
      - name: Checkout this repository (a te Dockerfile-od miatt)
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Get latest Home Assistant stable version
        id: ha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest stable Home Assistant: ${VERSION}"

      - name: Checkout official Home Assistant core
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ steps.ha.outputs.version }}
          path: ha-core

      - name: Replace Dockerfile with your 32-bit version
        run: |
          echo "=== Jelenlegi könyvtárstruktúra ==="
          find build-repo -maxdepth 3 -type f -name "Dockerfile*" || true
          echo ""
          echo "=== build-repo tartalma ==="
          ls -la build-repo/
          echo ""
          
          # Próbáljuk meg a legvalószínűbb helyeket
          if [ -f "build-repo/hass-core32/Dockerfile" ]; then
            cp build-repo/hass-core32/Dockerfile ha-core/Dockerfile
            echo "Másolva: build-repo/hass-core32/Dockerfile"
          elif [ -f "build-repo/Dockerfile" ]; then
            cp build-repo/Dockerfile ha-core/Dockerfile
            echo "Másolva: build-repo/Dockerfile"
          elif [ -f "build-repo/hass-core32bit/Dockerfile" ]; then
            cp build-repo/hass-core32bit/Dockerfile ha-core/Dockerfile
            echo "Másolva: build-repo/hass-core32bit/Dockerfile"
          else
            echo "HIBA: Nem találom a Dockerfile-t!"
            find build-repo -name "Dockerfile*" 
            exit 1
          fi
          
          echo ""
          echo "=== A bemásolt Dockerfile eleje ==="
          head -n 20 ha-core/Dockerfile

      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core
          retention-days: 1

  build-armv7:
    name: Build arm/v7
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v7
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-armv6:
    name: Build arm/v6
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v6
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v6
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: Create multi-arch manifest
    needs: [prepare, build-armv7, build-armv6]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch image
        run: |
          echo "Összefűzés: armv7 + armv6 → multi-arch"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6

          echo ""
          echo "Kész image-ek:"
          echo "  • ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  • ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"

