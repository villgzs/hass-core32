name: Build 32-bit Home Assistant

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # minden nap 04:00 UTC-kor ellenőrzi a legfrissebb stable-t

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: villgzs/hass-core32

jobs:
  build:
    name: Build armv7 + armv6 multi-arch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repository (for the Dockerfile)
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Get latest Home Assistant stable version
        id: ha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Latest stable Home Assistant: ${VERSION}"

      - name: Checkout official Home Assistant core
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ steps.ha.outputs.version }}
          path: ha-core

      - name: Replace Dockerfile with 32-bit version
        run: |
          cp build-repo/hass-core32/Dockerfile ha-core/Dockerfile
          echo "Dockerfile replaced successfully"
          ls -la ha-core/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v7
        id: build-v7
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push arm/v6
        id: build-v6
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v6
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ha.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6

          echo "Multi-arch image created:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ha.outputs.version }}"

      - name: Cleanup temporary tags
        run: |
          # A tmp tag-eket nem muszáj törölni, de szebb ha eltüntetjük
          echo "Temporary tags left for now (can be deleted manually if wanted)"
