name: Build 32-bit Home Assistant - CORE

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: "Home Assistant Core verzió (üres = legfrissebb stable)"
        required: false
        default: "2026.9.1"
  # schedule:
  #  - cron: "0 4 * * *"
  # push:
  #   branches:
  #     - main
      
env:
  
  # BUILD_FROM: dockergzs/hass-base-python:3.14-alpine3.24-armv7
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EXTRA_TAGS: "python:3.14-alpine3.24;homeassistant;home-assistant;homeassistant32;homeassistant-arm;homeassistant-arm32;arm32;hass-core32;home-assistant-core32"

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha.outputs.version }}
    steps:
      - name: Checkout this repository (a te Dockerfile-od miatt)
        uses: actions/checkout@v4
        with:
          path: build-repo
      
      - name: Get latest Home Assistant stable version
        id: ha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.core_version }}" ]; then
            VERSION="${{ inputs.core_version }}"
          else
            VERSION=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
          fi
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Home Assistant Core: ${VERSION}"          

      - name: Checkout official Home Assistant core
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ steps.ha.outputs.version }}
          path: ha-core

      - name: Replace Dockerfile with your 32-bit version
        run: |
          echo "=== Dockerfile másolása ==="
          cp build-repo/Dockerfile ha-core/Dockerfile
          echo "Sikeresen másolva: build-repo/Dockerfile → ha-core/Dockerfile"
          echo ""
          echo "=== A használt Dockerfile eleje ==="
          head -n 15 ha-core/Dockerfile

      - name: Pin Cython version in pyproject.toml
        run: |
          # Biztonságos csere: a meglévő setuptools sor mellé beszúrja a cython korlátozást
          sed -i 's/requires = \["setuptools==78.1.1"\]/requires = ["setuptools==78.1.1", "cython<3.2.7"]/' ha-core/pyproject.toml

          # Ellenőrzés (opcionális, de ajánlott)
          echo "=== Módosított [build-system] rész ==="
          sed -n '/\[build-system\]/,/^\[/p' ha-core/pyproject.toml | head -20

      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core
          retention-days: 2

  build-armv7:
    name: Build arm/v7
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v7
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-armv6:
    name: Build arm/v6
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v6
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v6
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  
  create-multi-manifest:
    name: Create multi-arch manifest
    needs: [prepare, build-armv7, build-armv6]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch image
        run: |
          echo "Összefűzés: armv7 + armv6 → multi-arch"
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv7 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tmp-armv6

          echo ""
          echo "Kész image-ek:"
          echo "  • ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "  • ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
      

  push-dockerhub:
    name: Push to Docker Hub
    needs: [prepare, create-multi-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Log in to GHCR (olvasáshoz)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
  
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Create multi-arch image on Docker Hub (latest + version + EXTRA_TAGS)
        run: |
          set -euo pipefail
  
          VERSION="${{ needs.prepare.outputs.version }}"
          GHCR_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-arm32"
  
          # Alap tagek
          TAGS=(
            "--tag ${DOCKERHUB_IMAGE}:latest"
            "--tag ${DOCKERHUB_IMAGE}:${VERSION}"
          )
  
          # EXTRA_TAGS feldolgozása (pontosvesszővel elválasztott lista)
          if [ -n "${{ env.EXTRA_TAGS }}" ]; then
            IFS=';' read -ra EXTRA <<< "${{ env.EXTRA_TAGS }}"
            for tag in "${EXTRA[@]}"; do
              # üres elemek kihagyása
              tag=$(echo "$tag" | xargs)
              # A kettőspontok cseréje kötőjelre a tag nevében, ha véletlenül benne maradna
              tag="${tag//:/-}"
              if [ -n "$tag" ]; then
                TAGS+=("${DOCKERHUB_IMAGE}:${tag}")
              fi
            done
          fi
  
          echo "Docker Hub tagek:"
          printf '  %s\n' "${TAGS[@]}"
          echo ""

          # Összeállítjuk a Buildx imagetools -t paramétereit
          IMAGETOOLS_ARGS=()
          for target in "${TARGETS[@]}"; do
            IMAGETOOLS_ARGS+=("-t" "$target")
          done
  
          docker buildx imagetools create \
            "${IMAGETOOLS_ARGS[@]}" \
            ${GHCR_IMAGE}:tmp-armv7 \
            ${GHCR_IMAGE}:tmp-armv6
  
          echo ""
          echo "Kész Docker Hub image-ek:"
          echo "  • ${DOCKERHUB_IMAGE}:latest"
          echo "  • ${DOCKERHUB_IMAGE}:${VERSION}"
          if [ -n "${{ env.EXTRA_TAGS }}" ]; then
            IFS=';' read -ra EXTRA <<< "${{ env.EXTRA_TAGS }}"
            for tag in "${EXTRA[@]}"; do
              tag=$(echo "$tag" | xargs)
              [ -n "$tag" ] && echo "  • ${DOCKERHUB_IMAGE}:${tag}"
            done
          fi          
