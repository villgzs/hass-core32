name: Build Rust 1.99.1 Docker Image (arm/v7)

on:
  workflow_dispatch: # Kézi indítási lehetőség az Actions fülön

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Jogosultság a ghcr.io-ra való feltöltéshez

    steps:
      - name: Repository lekérése
        uses: actions/checkout@v4

      - name: QEMU beállítása (cross-platform buildhez)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@v3

      - name: Bejelentkezés a GHCR-re
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image neve kisbetűssé alakítása
        id: prep
        run: |
          REPO_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/rust1.99" | tr '[:upper:]' '[:lower:]')
          echo "image_repo=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Build és Push (linux/arm/v7)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfiles/Dockerfile_rust1.99.1
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ steps.prep.outputs.image_repo }}:latest
            ${{ steps.prep.outputs.image_repo }}:1.99.1
