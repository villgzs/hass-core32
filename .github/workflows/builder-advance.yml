# 2026.SEPT.29: bevezetve az av_replace opció és érvényre is lép, ha kell.
# Áthozva a builder_new.yml-ből 2026.OKT.01.-én. Fő módostás a dockerfile forrása.
# 2026-OKT-7: A korábbi build-new aktualizálva buld-re! 

name: ADV.Build CORE-32-bit Home Assistant

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: "Home Assistant Core verzió ( üresen = legfrissebb stable)"
        required: false
        default: ""
      build_armv6:
        description: "Építsünk armv6-ot"
        type: boolean
        required: false
        default: false
      push_to_docker:
        description: "Push to dockerhub"
        type: boolean
        required: false
        default: false
  # schedule:
  #  - cron: "0 4 * * *"
  # push:
  #   branches:
  #     - main
  
env:
  
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EXTRA_TAGS: "arm32;latest"
  BASE_IMAGE: "ghcr.io/villgzs/hass-core32-baseadded"
  BASE_IMAGE_TAG: "2026.06.1-2026.07.0"
  # Dockerfile: relative to the repository root (/)
  DOCKERFILE: Dockerfiles/Dockerfile_reds_2026.9.4 
  HA_CORE_REPO: homeassistant/core
  HA_CORE_REPO_PATH: ha-core
  THIS_REPO: villgzs/hass-core32
  THIS_REPO_PATH: hass-core32-repo
  

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha.outputs.version }}
      pyver: ${{ steps.ha.outputs.pythonversion}}
      dockver: ${{ steps.ha.outputs.dockerversion }}
      tags: ${{ steps.ha.outputs.tags }}
      armv7image_ready: ${{ steps.check.outputs.armv7image_ready }}
      run_id: ${{ steps.findrunid.outputs.run_id }}
    steps:
      - name: Get latest Home Assistant stable version
        id: ha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.core_version }}" ]; then
            VERSION="${{ inputs.core_version }}"
            DOCKERTAGS="testingphase"
          else
            VERSION=$(gh api repos/home-assistant/core/releases/latest --jq '.tag_name')
            DOCKERTAGS="${{ env.EXTRA_TAGS }}"
          fi
      
          # BASE_IMAGE_VERSION lekérése a core builder.yml-ből az adott VERSION tag-ről
          BASE_IMAGE_VERSION=$(gh api "repos/home-assistant/core/contents/.github/workflows/builder.yml?ref=${VERSION}" \
            --jq '.content' | base64 -d | grep -oP 'BASE_IMAGE_VERSION:\s*"\K[^"]+')
      
          echo "BASE_IMAGE_VERSION=${BASE_IMAGE_VERSION}" >> $GITHUB_OUTPUT
      
          # Dockerfile lekérése a home-assistant/docker repóból a BASE_IMAGE_VERSION alapján
          DOCKERFILE_CONTENT=$(gh api "repos/home-assistant/docker/contents/Dockerfile?ref=${BASE_IMAGE_VERSION}" \
            --jq '.content' | base64 -d)
      
          # ARG BUILD_FROM sor és a végén levő verziószám kinyerése
          BUILD_FROM_LINE=$(echo "$DOCKERFILE_CONTENT" | grep '^ARG BUILD_FROM=' )
          BUILD_FROM_VERSION=$(echo "$BUILD_FROM_LINE" | sed 's/.*-//')

          echo "Home Assistant Core: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKERTAGS}" >> $GITHUB_OUTPUT
          echo "dockerversion=${BASE_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "pythonversion=${BUILD_FROM_VERSION}" >> $GITHUB_OUTPUT
      
          # SUMMARY
          echo "Home Assistant Core: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "tags=${DOCKERTAGS}" >> $GITHUB_STEP_SUMMARY
          echo "BASE_IMAGE_VERSION: ${BASE_IMAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "BUILD_FROM: ${BUILD_FROM_LINE}" >> $GITHUB_STEP_SUMMARY
          echo "BUILD_FROM Version: ${BUILD_FROM_VERSION}" >> $GITHUB_STEP_SUMMARY      

      - name: Check if armv7 image already exists on GHCR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ha.outputs.version }}"
          TAG="armv7-${VERSION}"
          PACKAGE=${{env.IMAGE_NAME}}          # a ghcr.io/villgzs/hass-core32 package neve
          PACKAGE="${PACKAGE#*/}"
          OWNER="${{ github.repository_owner }}"

          echo "Ellenőrzés: ghcr.io/${OWNER}/${PACKAGE}:${TAG}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 404 ]; then
            echo "API hiba (HTTP $HTTP_CODE) → feltételezzük, hogy nincs image, buildelünk"
            echo "armv7image_ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          EXISTS=$(echo "$BODY" | jq -r --arg tag "$TAG" '
            [.[] | select(.metadata.container.tags[]? == $tag)] | length
          ')

          if [ "$EXISTS" -gt 0 ]; then
            echo "✓ Az image már létezik → kihagyjuk a buildet"
            echo "armv7image_ready=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Az image még nem létezik → build szükséges"
            echo "armv7image_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Find the Build images workflow run for the latest stable tag
        # working-directory: ha-core
        id: findrunid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ha.outputs.version }}"
          echo "Looking for tag: $TAG"

          RUN_ID=""
          for i in 1 2 3 4 5; do
          
              # RUN_ID=$(gh api \
              #   "/repos/home-assistant/core/actions/workflows/builder.yml/runs?event=release&status=success&per_page=50" \
              #   --jq ".workflow_runs[] | select(.head_branch == \"$TAG\" or (.display_title | contains(\"$TAG\"))) | .id" \
              #   | head -n1)

              RUN_ID=$(gh api \
                "/repos/home-assistant/core/actions/workflows/builder.yml/runs?status=success&per_page=50" \
                --jq ".workflow_runs[] | select(.head_branch == \"$TAG\" or (.display_title | contains(\"$TAG\"))) | .id" \
                | head -n1)

              if [ -n "$RUN_ID" ]; then
                  break
                fi

              echo "Még nem található (próba $i/5). Várunk 90 másodpercet..."
              sleep 3
          done
      
          if [ -z "$RUN_ID" ]; then
            echo "Nem találtam sikeres Build images futást a $TAG taghez"
            exit 1
          fi
      
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Found run-id: $RUN_ID"

  build-armv7:
    name: Build arm/v7
    needs: prepare    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout this repository (a te Dockerfile-od miatt)
        uses: actions/checkout@v4
        with:
          path: ${{env.THIS_REPO_PATH}}
          token: ${{ secrets.TRANSLATION_UPLOAD }}
          # vagy Personal Access Token, ha a GITHUB_TOKEN nem elég

      - name: Checkout official Home Assistant core
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ needs.prepare.outputs.version }}
          path: ${{env.HA_CORE_REPO_PATH}}

      - name: Patch dockerfile
        working-directory: ${{env.HA_CORE_REPO_PATH}}
        run: |
          pwd
          ls -las ./
          echo "----"
          ls -las ../

          echo "=== Patching Dockerfile ==="
          PATCH_FILE="../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_${{ needs.prepare.outputs.version }}.patch"
          
          if [ -f "$PATCH_FILE" ]; then
            echo "Patch file found: $PATCH_FILE"
            patch Dockerfile < "$PATCH_FILE"
          else
            echo "No version-specific patch found for ${{ needs.prepare.outputs.version }}, trying general..."
            PATCH_FILE="../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_general.patch"
          
            if [ -f "$PATCH_FILE" ]; then
              echo "General patch file found: $PATCH_FILE"
              patch Dockerfile < "$PATCH_FILE"
            else
              echo "No patch file found at all (neither version-specific nor general). Stopping."
              exit 1
            fi
          fi

          echo "=== A használt Dockerfile ==="
          cat Dockerfile || true

      - name: Check version in core_versions guidance
        id: guidedversion
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          GUIDANCE_FILE="guidance/core-versions"
      
          echo "Looking for version: $VERSION"
          echo "In file: $GUIDANCE_FILE"
          pwd
          ls -las
      
          if [ ! -f "$GUIDANCE_FILE" ]; then
            echo "::error::Guidance file not found: $GUIDANCE_FILE"
            exit 1
          fi
      
          MATCHING_LINE=$(grep "^${VERSION}" "$GUIDANCE_FILE" || true)
      
          if [ -z "$MATCHING_LINE" ]; then
            echo "::warning::Version ${VERSION} not found in $GUIDANCE_FILE"
            echo "Available versions:"
            cat "$GUIDANCE_FILE"
            echo 
            echo "Trying as versions of python ${{ needs.prepare.outputs.pyver }} and docker ${{ needs.prepare.outputs.dockver }}"
            MATCHING_LINE="${{needs.prepare.outputs.version}}  ${{ needs.prepare.outputs.pyver }}-${{ needs.prepare.outputs.dockver }}"
          fi
      
          # A VERSION után következő szöveg, whitespace nélkül
          EXTRA_TEXT=$(echo "$MATCHING_LINE" | sed -E "s/^${VERSION}[[:space:]]*//" | xargs)
      
          echo "We will use this line: $MATCHING_LINE"
          echo "Text after version:"
          echo "$EXTRA_TEXT"

          echo "tag=$EXTRA_TEXT" >> $GITHUB_OUTPUT
      
      - name: Download translations artifact
        id: transl
        uses: actions/download-artifact@v4   # vagy újabb
        with:
          name: translations
          github-token: ${{ secrets.GITHUB_TOKEN }}   # public repo esetén elég
          repository: home-assistant/core
          run-id: ${{ needs.prepare.outputs.run_id }}
          path: ha-core

      - name: Save translations package into this repository
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          # A letöltött csomagolt fájl
          SOURCE_FILE="../ha-core/translations.tar.gz"
          
          # Cél a saját repo translations mappájában
          TARGET_DIR="translations"
          TARGET_FILE="${TARGET_DIR}/translations_${VERSION}.tar.gz"
      
          echo "Saving translations package for version: $VERSION"
      
          if [ ! -f "$SOURCE_FILE" ]; then
            echo "::error::Downloaded package not found: $SOURCE_FILE"
            ls -la ../ha-core/
            exit 1
          fi
      
          mkdir -p "$TARGET_DIR"
          cp "$SOURCE_FILE" "$TARGET_FILE"
      
          echo "Saved as: $TARGET_FILE"
          ls -lh "$TARGET_FILE"

      - name: Commit and push new translations file
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET_FILE="translations/translations_${VERSION}.tar.gz"
      
          echo "Checking for new translations file: $TARGET_FILE"
      
          if [ ! -f "$TARGET_FILE" ]; then
            echo "::error::New translations file not found: $TARGET_FILE"
            exit 1
          fi
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          # Csak a friss fájlt adjuk hozzá (a régieket nem)
          git add "$TARGET_FILE"
      
          if git diff --staged --quiet; then
            echo "No changes to commit (file already exists and is identical)."
          else
            git commit -m "Add translations for ${VERSION}"
            git push
            echo "Successfully pushed $TARGET_FILE"
          fi

      - name: Extract
        working-directory: ha-core
        run: |
          tar xvf translations.tar.gz
          echo "translations extracted"
          # ls -la homeassistant/components/*/translations/ 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v7
        if: needs.prepare.outputs.armv7image_ready != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${{ needs.prepare.outputs.version }}
          provenance: false
          build-args: |
            # BUILD_FROM=${{env.BASE_IMAGE}}:${{env.BASE_IMAGE_TAG}}
            BUILD_FROM=${{env.BASE_IMAGE}}:${{steps.guidedversion.outputs.tag}}

  build-armv6:
    name: Build arm/v6
    needs: prepare
    if: ${{inputs.build_armv6}}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: ha-core-prepared
          path: ha-core

      - name: Checking attributes of /init
        run: |
          chmod 755 ha-core/rootfs/init
          chmod 755 ha-core/rootfs/etc/services.d/home-assistant/*
          
          echo "ls -las ha-core/rootfs/init"
          ls -las ha-core/rootfs/init
          ls -las ha-core/rootfs/etc/services.d/home-assistant/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v6
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v6
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv6-${{ needs.prepare.outputs.version }}
          provenance: false
          # cache-from: type=gha,scope=armv6-${{ needs.prepare.outputs.version }}
          # cache-to: type=gha,mode=max,scope=armv6-${{ needs.prepare.outputs.version }}
          
  
  create-multi-manifest:
    name: Create multi-arch manifest
    needs: [prepare, build-armv7, build-armv6]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-armv7.result == 'success' || needs.build-armv6.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch image
        run: |

          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGES=""

          if [ "${{ needs.build-armv7.result }}" = "success" ]; then
            IMAGES="$IMAGES $TARGET_IMAGE:armv7-${{ needs.prepare.outputs.version }}"
            echo "✓ armv7 build sikeres → hozzáadva"
          else
            echo "✗ armv7 build sikertelen → kihagyva"
          fi
  
          if [ "${{ needs.build-armv6.result }}" = "success" ]; then
            IMAGES="$IMAGES $TARGET_IMAGE:armv6-${{ needs.prepare.outputs.version }}"
            echo "✓ armv6 build sikeres → hozzáadva"
          else
            echo "✗ armv6 build sikertelen → kihagyva"
          fi
  
          if [ -z "$IMAGES" ]; then
            echo "Nincs egyetlen sikeres build sem, kihagyom a manifest létrehozását."
            exit 0
          fi
  
          echo ""
          echo "Összefűzés a következő image-ekkel:$IMAGES"
          echo ""
  
          docker buildx imagetools create \
            --prefer-index=false \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }} \
            $IMAGES
    
          echo ""
          echo "Kész image-ek:"
          echo "  • ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"                
      

  push-dockerhub:
    name: Push to Docker Hub (armv7 only)
    needs: [prepare, build-armv7]
    if: |
      always() &&
      inputs.push_to_docker &&
      ( needs.prepare.result == 'success' &&
      needs.build-armv7.result == 'success' ||
      needs.prepare.outputs.armv7image_ready )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (olvasáshoz)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy armv7 image to Docker Hub (egy az egyben)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${VERSION}"
          DST="${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7"

          echo "Forrás: $SRC"
          echo "Cél:    $DST"

          # Egy az egyben átmásolja az armv7 image-t (nincs multi-arch)
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DST}:${VERSION}" \
            --tag "${DST}:armv7-${VERSION}" \
            --tag "${DST}:latest" \
            "$SRC"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${VERSION}"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7:${VERSION}"

          echo ""
          echo "Kész:"
          echo "  • ${DST}:${VERSION}"
          echo "  • ${DST}:armv7-${VERSION}"
          echo "  • ${DST}:latest"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7
          readme-filepath: ./README.md
          short-description: Home Assistant 32-bit (only armv7) image
