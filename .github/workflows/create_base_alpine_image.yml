name: Create Base Alpine Image

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to registry"
        type: boolean
        default: true
      required_version:
        description: "Home Assistant Base Images verzió (üres = legfrissebb stable)"
        required: false
        default: ""
      patch_files:
        description: "Dockerfile foltozás:"
        required: false
        type: boolean
        default: true
      test_build:
        description: "Teszt üzemmód:"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-basealpine
  HA_REPO: home-assistant/docker-base
  HA_REPO_PATH: ha-base-repo
  FILE_PATH: alpine
  THIS_REPO: villgzs/hass-core32
  THIS_REPO_PATH: hass-core32-repo

jobs:
  prepare:
    name: Prepare source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha-lat.outputs.version }}
      tags: ${{steps.ha-lat.outputs.tags}}
    steps:
      - name: Get latest stable version
        id: ha-lat
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.required_version }}" ]; then
            VERSION="${{ inputs.required_version }}"
            DOCKERTAGS="arm32"
          else
            VERSION=$(gh api repos/${{env.HA_REPO}}/releases/latest --jq '.tag_name')
            DOCKERTAGS="latest"
          fi
          
          echo "Home Assistant version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKERTAGS}" >> $GITHUB_OUTPUT                    
          
          echo "version=${VERSION}"   >> $GITHUB_STEP_SUMMARY
          echo "tags=${DOCKERTAGS}"   >> $GITHUB_STEP_SUMMARY 
          
  build:
    name: Build ${{ matrix.architecture }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: armv7
            platform: linux/arm/v7
          - architecture: armhf
            platform: linux/arm/v6
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          repository: ${{env.THIS_REPO}}
          path: ${{env.THIS_REPO_PATH}}

      - name: Checkout official Home Assistant repository
        uses: actions/checkout@v4
        with:
          repository: ${{env.HA_REPO}}
          ref: ${{ needs.prepare.outputs.version }}
          path: ${{env.HA_REPO_PATH}}

      - name: Patch application - for Alpine Dockerfile
        if: ${{ inputs.patch_files }}
        working-directory: ${{env.HA_REPO_PATH}}
        run: |
          echo "Alpine Dockerfile"
          patch -p1 < ../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_basealpine_${{needs.prepare.outputs.version}}.patch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: copy Dockerfile 
        working-directory: ${{env.THIS_REPO_PATH}}
        run: |
          mkdir -p Dockerfiles
          cp ../${{env.HA_REPO_PATH}}/${{env.FILE_PATH}}/Dockerfile ./Dockerfiles/Dockerfile_${{env.HA_REPO_PATH}}_${{needs.prepare.outputs.version}}

      - name: List folders 
        working-directory: ${{env.HA_REPO_PATH}}/${{env.FILE_PATH}}
        run: |
          ls -lR || true          

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{env.HA_REPO_PATH}}/${{env.FILE_PATH}}
          file: ./${{env.HA_REPO_PATH}}/${{env.FILE_PATH}}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          build-args: |
            BASE_ALPINE_VERSION=${{ needs.prepare.outputs.version }}
            TEST_BUILD=${{ inputs.test_build }}
            
      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs: [prepare,build]
    if: inputs.push
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (final tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{needs.prepare.outputs.version}}
            type=raw,value=${{needs.prepare.outputs.tags}}

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          DIGESTS=$(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)
          docker buildx imagetools create ${TAGS} ${DIGESTS}

      - name: Summary
        run: |
          echo "### Multi-Arch Manifest Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
