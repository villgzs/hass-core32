# builder-dev.yml
# A builder.yml mintájára készült fejlesztői (dev) ág build workflow.
# Nem a stable release-ből, hanem a home-assistant/core dev ág utolsó sikeres
# "Build images" workflow futásából veszi az alap adatokat (fordítások artifact).
# Az elkészült image a "dev" tag-et kapja, és a ghcr.io-ra megy.
#
# Forrás minta: https://github.com/villgzs/hass-core32/blob/main/.github/workflows/builder.yml
# Hivatalos builder: https://github.com/home-assistant/core/actions/workflows/builder.yml

name: DEV-ARMV7-BUILD-CORE-IMAGE

on:
  workflow_dispatch:
    inputs:
      build_armv6:
        description: "Építsünk armv6-ot"
        type: boolean
        required: false
        default: false
      push_to_docker:
        description: "Push to dockerhub"
        type: boolean
        required: false
        default: true
  schedule:
     - cron: "56 23 * * *"   # pl. naponta hajnalban a dev buildhez
              
  # push:
  #   branches:
  #     - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  EXTRA_TAGS: "dev"
  BASE_IMAGE: "ghcr.io/villgzs/hass-core32-baseadded"
  HA_CORE_REPO: home-assistant/core
  HA_CORE_REPO_PATH: ha-core
  THIS_REPO: villgzs/hass-core32
  THIS_REPO_PATH: hass-core32-repo
  BUILD_TYPE: core
  PUSH_TO_DOCKER: ${{ github.event_name == 'schedule' && 'true' || inputs.push_to_docker }}

jobs:
  call-time-workflow:  
    uses: villgzs/villgzs/.github/workflows/get-time.yml@main   # ← helyi reusable workflow
    
  prepare:
    name: Prepare source (dev branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ha.outputs.version }}
      jobversion: ${{ steps.ha.outputs.jobversion }}
      pyver: ${{ steps.ha.outputs.pythonversion}}
      dockver: ${{ steps.ha.outputs.dockerversion }}
      tags: ${{ steps.ha.outputs.tags }}
      armv7image_ready: ${{ steps.check.outputs.armv7image_ready }}
      run_id: ${{ steps.findrunid.outputs.run_id }}
      sha: ${{ steps.ha.outputs.sha }}
      push_to_docker: ${{steps.ha.outputs.push_to_docker}}
    permissions:
      contents: read
      actions: read
    steps:      
      - name: Get latest successful Build images run from home-assistant/core (dev)
        id: ha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A legutóbbi sikeres futás a builder.yml workflow-ból, dev ágon
          # (scheduled vagy workflow_dispatch, head_branch == "dev")
          RUN_JSON=$(gh api \
            "/repos/home-assistant/core/actions/workflows/builder.yml/runs?status=success&branch=dev&per_page=10" \
            --jq '.workflow_runs[0]')

          if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
            echo "::error::Nem találtam sikeres Build images futást a dev ágon"
            exit 1
          fi

          RUN_ID=$(echo "$RUN_JSON" | jq -r '.id')
          HEAD_SHA=$(echo "$RUN_JSON" | jq -r '.head_sha')
          # A dev buildnél a verzió tipikusan nightly formátumú (pl. 2026.10.0.dev0)
          # A head_sha rövid formáját és a dátumot használjuk a taghez
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          # Próbáljuk kiolvasni a display_title-ból vagy a head_branch-ből
          DISPLAY_TITLE=$(echo "$RUN_JSON" | jq -r '.display_title // empty')
          CREATED_AT=$(echo "$RUN_JSON" | jq -r '.created_at' | cut -dT -f1)
          CHECK_SUITE_ID=$(echo "$RUN_JSON" | jq -r '.check_suite_id')

          echo "Found successful run on dev:"
          echo "  run_id          = $RUN_ID"
          echo "  check_suite_id  = $CHECK_SUITE_ID"
          echo "  head_sha        = $HEAD_SHA"
          echo "  short_sha       = $SHORT_SHA"
          echo "  created_at      = $CREATED_AT"
          echo "  title           = $DISPLAY_TITLE"

          # --- Job verzió kinyerése a check suite log ZIP-ből ---
          JOBVERSION=""
          TMPDIR=$(mktemp -d)
          LOG_ZIP="${TMPDIR}/suite-logs.zip"

          # 1. Letöltés a suites URL-ről (a te példád szerint)
          #    Authentikált letöltés szükséges
          HTTP_CODE=$(curl -sL -o "$LOG_ZIP" -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://github.com/home-assistant/core/suites/${CHECK_SUITE_ID}/logs?attempt=1")

          if [ "$HTTP_CODE" = "200" ] && [ -s "$LOG_ZIP" ]; then
            # 2. Kicsomagolás és a Publish version files log keresése
            unzip -q -o "$LOG_ZIP" -d "$TMPDIR" || true

            # A fájl neve tipikusan: 0_Publish version files.txt (vagy hasonló)
            PUBLISH_LOG=$(find "$TMPDIR" -type f -iname '*Publish*version*files*.txt' | head -1)

            if [ -n "$PUBLISH_LOG" ] && [ -f "$PUBLISH_LOG" ]; then
              # 3. INPUTS_VERSION: 2026.12.0.dev202611030216 kinyerése
              JOBVERSION=$(grep -oE 'INPUTS_VERSION:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?' "$PUBLISH_LOG" \
                           | head -1 \
                           | sed -E 's/INPUTS_VERSION:[[:space:]]*//' \
                           || true)
            fi
          else
            echo "::warning::Suite log letöltés sikertelen (HTTP $HTTP_CODE), próbálok API-s fallbacket"
          fi

          # Fallback 1: teljes run log (API)
          if [ -z "$JOBVERSION" ]; then
            echo "Próbálom a /actions/runs/.../logs endpointot..."
            if gh api \
                 -H "Accept: application/vnd.github+json" \
                 "/repos/home-assistant/core/actions/runs/${RUN_ID}/logs" \
                 > "$LOG_ZIP" 2>/dev/null; then
              unzip -q -o "$LOG_ZIP" -d "$TMPDIR" || true
              PUBLISH_LOG=$(find "$TMPDIR" -type f -iname '*Publish*version*files*.txt' | head -1)
              if [ -n "$PUBLISH_LOG" ]; then
                JOBVERSION=$(grep -oE 'INPUTS_VERSION:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+)?' "$PUBLISH_LOG" \
                             | head -1 \
                             | sed -E 's/INPUTS_VERSION:[[:space:]]*//' \
                             || true)
              fi
            fi
          fi

          # Fallback 2: ha még mindig nincs, a régi módszer
          if [ -z "$JOBVERSION" ]; then
            echo "::warning::Nem sikerült a jobverziót kinyerni, fallback-et használok"
            JOBVERSION="dev-${CREATED_AT}-${SHORT_SHA}"
          fi

          VERSION="$JOBVERSION"
          DOCKERTAGS="${{ env.EXTRA_TAGS }}"

          echo "Found successful run on dev:"
          echo "  run_id       = $RUN_ID"
          echo "  head_sha     = $HEAD_SHA"
          echo "  short_sha    = $SHORT_SHA"
          echo "  created_at   = $CREATED_AT"
          echo "  title        = $DISPLAY_TITLE"
          echo "  version      = $VERSION"
          echo "  jobversion   = $JOBVERSION"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "jobversion=${JOBVERSION}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKERTAGS}" >> $GITHUB_OUTPUT
          echo "sha=${HEAD_SHA}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "push_to_docker=${{env.PUSH_TO_DOCKER}}"  >> $GITHUB_OUTPUT

          echo "Home Assistant Core (dev): ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "created_at:                ${CREATED_AT}" >> $GITHUB_STEP_SUMMARY
          echo "short_sha:                 ${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "Job version:               ${JOBVERSION}" >> $GITHUB_STEP_SUMMARY
          echo "SHA:                       ${HEAD_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "Run ID:                    ${RUN_ID}" >> $GITHUB_STEP_SUMMARY

          # BASE_IMAGE_VERSION lekérése a core builder.yml-ből az adott VERSION tag-ről
          BASE_IMAGE_VERSION=$(gh api "repos/home-assistant/core/contents/.github/workflows/builder.yml?ref=${HEAD_SHA}" \
            --jq '.content' | base64 -d | grep -oP 'BASE_IMAGE_VERSION:\s*"\K[^"]+')
      
          echo "BASE_IMAGE_VERSION=${BASE_IMAGE_VERSION}" >> $GITHUB_OUTPUT
      
          # Dockerfile lekérése a home-assistant/docker repóból a BASE_IMAGE_VERSION alapján
          DOCKERFILE_CONTENT=$(gh api "repos/home-assistant/docker/contents/Dockerfile?ref=${BASE_IMAGE_VERSION}" \
            --jq '.content' | base64 -d)
      
          # ARG BUILD_FROM sor és a végén levő verziószám kinyerése
          BUILD_FROM_LINE=$(echo "$DOCKERFILE_CONTENT" | grep '^ARG BUILD_FROM=' )
          BUILD_FROM_VERSION=$(echo "$BUILD_FROM_LINE" | sed 's/.*-//')

          echo "Home Assistant Core: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKERTAGS}" >> $GITHUB_OUTPUT
          echo "dockerversion=${BASE_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "pythonversion=${BUILD_FROM_VERSION}" >> $GITHUB_OUTPUT

          # SUMMARY
          echo "Home Assistant Core: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "tags=${DOCKERTAGS}" >> $GITHUB_STEP_SUMMARY
          echo "BASE_IMAGE_VERSION used for core build:    ${BASE_IMAGE_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "BASE_IMAGE built from this python version: ${BUILD_FROM_VERSION}" >> $GITHUB_STEP_SUMMARY 

      - name: Check if armv7-dev image already exists on GHCR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ha.outputs.version }}"
          TAG="armv7-${VERSION}"
          PACKAGE=${{env.IMAGE_NAME}}          # a ghcr.io/villgzs/hass-core32 package neve
          PACKAGE="${PACKAGE#*/}"
          OWNER="${{ github.repository_owner }}"

          echo "Ellenőrzés: ghcr.io/${OWNER}/${PACKAGE}:${TAG}"

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/versions?per_page=100")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -eq 404 ]; then
            echo "API hiba (HTTP $HTTP_CODE) → feltételezzük, hogy nincs image, buildelünk"
            echo "armv7image_ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          EXISTS=$(echo "$BODY" | jq -r --arg tag "$TAG" '
            [.[] | select(.metadata.container.tags[]? == $tag)] | length
          ')

          if [ "$EXISTS" -gt 0 ]; then
            echo "✓ Az image már létezik → kihagyjuk a buildet"
            echo "armv7image_ready=true" >> $GITHUB_OUTPUT
          else
            echo "✗ Az image még nem létezik → build szükséges"
            echo "armv7image_ready=false" >> $GITHUB_OUTPUT
          fi

      - name: Confirm run_id for translations artifact
        id: findrunid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ steps.ha.outputs.run_id }}"
          if [ -z "$RUN_ID" ]; then
            echo "::error::run_id hiányzik"
            exit 1
          fi
      
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Found run-id: $RUN_ID"

      - name: Get ha-version
        id: version
        uses: home-assistant/actions/helpers/version@master 
        with:
          type: ${{ env.BUILD_TYPE }}

      - name: Display the original version number
        id: dispversion
        run: |
          ORIG_ID="${{ steps.version.outputs.version }}"
          if [ -z "$ORIG_ID" ]; then
            echo "::error::ORIG_ID hiányzik"
            
          fi
          echo "origversion=$ORIG_ID" >> $GITHUB_OUTPUT
          echo "Version come from Home-Assistant : $ORIG_ID"

  build-armv7:
    name: Build arm/v7 (dev)
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout this repository (Dockerfile / patches miatt)
        uses: actions/checkout@v4
        with:
          path: ${{ env.THIS_REPO_PATH }}
          token: ${{ secrets.TRANSLATION_UPLOAD }}
          # vagy Personal Access Token, ha a GITHUB_TOKEN nem elég

      - name: Checkout official Home Assistant core (dev branch, specific SHA)
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ needs.prepare.outputs.sha }}
          path: ${{ env.HA_CORE_REPO_PATH }}

      - name: Patch dockerfile
        working-directory: ${{ env.HA_CORE_REPO_PATH }}
        run: |
          pwd
          ls -las ./
          echo "----"
          ls -las ../

          echo "=== Patching Dockerfile ==="
          # Dev ágnál általában a general patch-et használjuk, mert a verzió változó
          PATCH_FILE="../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_general.patch"

          if [ -f "$PATCH_FILE" ]; then
            echo "General patch file found: $PATCH_FILE"
            patch Dockerfile < "$PATCH_FILE"
          else
            # Próbáljuk a legutóbbi stable-szerű patch-et is
            echo "No general patch found, looking for any Dockerfile_core_*.patch..."
            LATEST_PATCH=$(ls -1 ../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_*.patch 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$LATEST_PATCH" ] && [ -f "$LATEST_PATCH" ]; then
              echo "Using latest available patch: $LATEST_PATCH"
              patch Dockerfile < "$LATEST_PATCH"
            else
              echo "No patch file found at all. Stopping."
              exit 1
            fi
          fi

          echo "=== A használt Dockerfile ==="
          cat Dockerfile || true

      - name: Determine base image tag (guidance or fallback)
        id: guidedversion
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          VERSION="${{needs.prepare.outputs.version}}"
          GUIDANCE_FILE="guidance/core-versions"
      
          echo "Looking for version: $VERSION"
          echo "In file: $GUIDANCE_FILE"
          pwd
          ls -las
      
          if [ ! -f "$GUIDANCE_FILE" ]; then
            echo "::error::Guidance file not found: $GUIDANCE_FILE"
            exit 1
          fi
      
          MATCHING_LINE=$(grep "^${VERSION}" "$GUIDANCE_FILE" || true)
      
          if [ -z "$MATCHING_LINE" ]; then
            echo "::warning::Version ${VERSION} not found in $GUIDANCE_FILE"
            echo "Available versions:"
            cat "$GUIDANCE_FILE"
            echo 
            echo "Trying as versions of python ${{ needs.prepare.outputs.pyver }} and docker ${{ needs.prepare.outputs.dockver }}"
            MATCHING_LINE="${{needs.prepare.outputs.version}}  ${{ needs.prepare.outputs.pyver }}-${{ needs.prepare.outputs.dockver }}"
          fi
      
          # A VERSION után következő szöveg, whitespace nélkül
          EXTRA_TEXT=$(echo "$MATCHING_LINE" | sed -E "s/^${VERSION}[[:space:]]*//" | xargs)
      
          echo "We will use this line: $MATCHING_LINE"
          echo "Text after version:"
          echo "$EXTRA_TEXT"

          echo "tag=$EXTRA_TEXT" >> $GITHUB_OUTPUT

      - name: Download translations artifact from official Build images (dev)
        id: transl
        uses: actions/download-artifact@v4   # vagy újabb
        with:
          name: translations
          github-token: ${{ secrets.GITHUB_TOKEN }}   # public repo esetén elég
          repository: home-assistant/core
          run-id: ${{ needs.prepare.outputs.run_id }}
          path: ha-core

      - name: Save translations package into this repository
        working-directory: ${{ env.THIS_REPO_PATH }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          # A letöltött csomagolt fájl
          SOURCE_FILE="../ha-core/translations.tar.gz"
          
          # Cél a saját repo translations mappájában
          TARGET_DIR="translations"
          TARGET_FILE="${TARGET_DIR}/translations_${VERSION}.tar.gz"

          echo "Saving translations package for version: $VERSION"

          if [ ! -f "$SOURCE_FILE" ]; then
            echo "::warning::Downloaded package not found: $SOURCE_FILE (dev build folytatódik)"
            ls -la ../ha-core/ || true
            exit 0
          fi

          mkdir -p "$TARGET_DIR"
          cp "$SOURCE_FILE" "$TARGET_FILE"
          echo "Saved as: $TARGET_FILE"
          ls -lh "$TARGET_FILE"

      - name: Commit and push new translations file
        working-directory: ${{ env.THIS_REPO_PATH }}
        continue-on-error: true
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TARGET_FILE="translations/translations_${VERSION}.tar.gz"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "No new translations file to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          # Csak a friss fájlt adjuk hozzá (a régieket nem)
          git add "$TARGET_FILE"

          if git diff --staged --quiet; then
            echo "No changes to commit (file already exists and is identical)."
          else
            git commit -m "Add translations for ${VERSION} (dev)"
            git push
            echo "Successfully pushed $TARGET_FILE"
          fi

      - name: Extract translations
        working-directory: ha-core
        run: |
          if [ -f translations.tar.gz ]; then
            tar xvf translations.tar.gz
            echo "translations extracted"
          else
            echo "::warning::translations.tar.gz not found, continuing without it"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v7 (dev)
        if: needs.prepare.outputs.armv7image_ready != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v7
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-dev
          provenance: false
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}:${{ steps.guidedversion.outputs.tag }}

  build-armv6:
    name: Build arm/v6 (dev)
    needs: prepare
    if: ${{ inputs.build_armv6 }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.THIS_REPO_PATH }}

      - name: Checkout official Home Assistant core (dev SHA)
        uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ needs.prepare.outputs.sha }}
          path: ${{ env.HA_CORE_REPO_PATH }}

      - name: Patch dockerfile
        working-directory: ${{ env.HA_CORE_REPO_PATH }}
        run: |
          PATCH_FILE="../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_general.patch"
          if [ -f "$PATCH_FILE" ]; then
            patch Dockerfile < "$PATCH_FILE"
          else
            LATEST_PATCH=$(ls -1 ../${{ env.THIS_REPO_PATH }}/patches/Dockerfile_core_*.patch 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$LATEST_PATCH" ]; then
              patch Dockerfile < "$LATEST_PATCH"
            else
              echo "No patch found"
              exit 1
            fi
          fi

      - name: Download translations artifact
        uses: actions/download-artifact@v4
        with:
          name: translations
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: home-assistant/core
          run-id: ${{ needs.prepare.outputs.run_id }}
          path: ha-core

      - name: Extract translations
        working-directory: ha-core
        run: |
          if [ -f translations.tar.gz ]; then
            tar xvf translations.tar.gz
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm/v6 (dev)
        uses: docker/build-push-action@v6
        with:
          context: ha-core
          file: ha-core/Dockerfile
          platforms: linux/arm/v6
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv6-${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv6-dev
          provenance: false

  create-multi-manifest:
    name: Create multi-arch manifest (dev)
    needs: [prepare, build-armv7, build-armv6]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-armv7.result == 'success' || needs.build-armv6.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch image with "dev" tag
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          IMAGES=""

          if [ "${{ needs.build-armv7.result }}" = "success" ] || [ "${{ needs.prepare.outputs.armv7image_ready }}" = "true" ]; then
            IMAGES="$IMAGES $TARGET_IMAGE:armv7-${VERSION}"
          fi

          if [ "${{ needs.build-armv6.result }}" = "success" ]; then
            IMAGES="$IMAGES $TARGET_IMAGE:armv6-${VERSION}"
          fi

          if [ -z "$IMAGES" ]; then
            echo "Nincs sikeresen buildelt image a multi-arch manifesthez"
            exit 1
          fi

          echo "Létrehozandó multi-arch image-ek a következő tag-ekkel:"
          echo "  • $TARGET_IMAGE:dev"
          echo "  • $TARGET_IMAGE:${VERSION}"
          echo "Forrás image-ek: $IMAGES"

          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:dev" \
            --tag "${TARGET_IMAGE}:${VERSION}" \
            $IMAGES

          echo ""
          echo "Kész image-ek:"
          echo "  • ${TARGET_IMAGE}:dev"
          echo "  • ${TARGET_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${TARGET_IMAGE}:dev" || true

  push-dockerhub:
    name: Push to Docker Hub (armv7 only)
    needs: [prepare, build-armv7]
    if: |
      always() &&
      needs.prepare.outputs.push_to_docker &&
      ( needs.prepare.result == 'success' &&
      needs.build-armv7.result == 'success' ||
      needs.prepare.outputs.armv7image_ready )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (olvasáshoz)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy armv7 image to Docker Hub (homeassistant-armv7)
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${VERSION}"
          DST="${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7"
          DST1="${{ secrets.DOCKERHUB_USERNAME }}/armv7-homeassistant"

          echo "Forrás: $SRC"
          echo "Cél:    $DST"
          echo "Cél1:   $DST1"

          # Egy az egyben átmásolja az armv7 image-t (nincs multi-arch)
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DST1}:${VERSION}" \
            --tag "${DST1}:armv7-${VERSION}" \
            --tag "${DST1}:${{needs.prepare.outputs.tags}}" \
            --tag "${DST}:${VERSION}" \
            --tag "${DST}:armv7-${VERSION}" \
            --tag "${DST}:${{needs.prepare.outputs.tags}}" \
            "$SRC"

          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:armv7-${VERSION}"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7:${VERSION}"
          docker buildx imagetools inspect "${{ secrets.DOCKERHUB_USERNAME }}/armv7-homeassistant:${VERSION}"

          echo ""
          echo "Kész:"
          echo "  • ${DST}:${VERSION}"
          echo "  • ${DST}:armv7-${VERSION}"
          echo "  • ${DST}:${{needs.prepare.outputs.tags}}"
          echo "  • ${DST1}:${VERSION}"
          echo "  • ${DST1}:armv7-${VERSION}"
          echo "  • ${DST1}:${{needs.prepare.outputs.tags}}"      

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/homeassistant-armv7
          readme-filepath: ./README.md
          short-description: Home Assistant 32-bit (only armv7) image

      - name: Update Docker Hub README - 1
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/armv7-homeassistant
          readme-filepath: ./README.md
          short-description: Home Assistant 32-bit (only armv7) image
